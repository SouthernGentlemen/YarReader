name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Reproduce tagged state
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run check:history
          npm run check:safety
      - name: Require annotated tag
        run: |
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          git fetch --force --no-tags origin "$tag_ref:$tag_ref"
          test "$(git cat-file -t "$tag_ref")" = tag
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet origin main
          notes=$(mktemp)
          git show "origin/main:docs/releases/$GITHUB_REF_NAME.md" > "$notes"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes" --verify-tag
